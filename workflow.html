<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工况自适应工作流</title><style>body{font-family:Microsoft YaHei,sans-serif;max-width:1100px;margin:35px auto;padding:20px;background:#f0f4f5;color:#18313d;line-height:1.8}.flow{display:flex;gap:10px;flex-wrap:wrap}.box{background:white;border:1px solid #a6cbc7;border-radius:12px;padding:18px;flex:1;min-width:130px}img{width:100%}a{color:#146f6b}</style><a href="/">返回智能体</a><h1>工况自适应工作流 v2.0 实验版</h1><div class="flow"><div class="box">三轴浮点信号图<br>↓<br>测量噪声特征</div><div class="box">模型按分段选择<br>baseline / 2021 / 2023</div><div class="box">执行滤波组合<br>↓<br>保留检查与回退</div><div class="box">上下文融合<br>↓<br>检测与坐标映射</div><div class="box">证据报告<br>↓<br>追问复核</div></div><p>判别的是信号形态，实际速度与提离未知。模型选路线，数值工具执行；实际路线可因保留检查回退。</p><p>当前开发集自适应性能弱于旧基线。<a href="自适应滤波算法复现与验证.md">算法细节和验证结果</a></p><h2>旧fast / balanced流程</h2><img src="工作流.png" alt="旧基线工作流"></html>
